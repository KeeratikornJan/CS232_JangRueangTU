<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ระบบร้องเรียน แจ้งเหตุ ในมหาวิทยาลัยธรรมศาสตร์" />
  <title>JANGRUEANG TU – เข้าสู่ระบบ</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="icon" type="image/x-icon" href="../image/JangRueang.png"/>
  <!-- Stylesheet -->
  <link rel="stylesheet" href="../css/LoginPage.css" />
</head>
<body>

  <!-- ════════════════════════════════════════
       Left panel – login form
  ════════════════════════════════════════ -->
  <main class="login-panel" role="main">
    <div class="login-panel__form-wrap">

        <a href="http://cs232-jangrueangtu-user.s3-website-us-east-1.amazonaws.com/index.html">
            <img class="LoginLogo"
            src="../image/JangruengBlueLogo.png"
            alt="JangruengBlueLogo" width="400px">
        </a>


      <h1 class="login-panel__heading">ลงชื่อเข้าใช้</h1>

      <form class="login-form" id="loginForm" novalidate>

        <!-- Username (Cognito username — usually the email) -->
        <div class="form-field">
          <label class="form-field__label" for="username">ชื่อผู้ใช้ / อีเมล</label>
          <div class="form-field__input-wrap">
            <span class="form-field__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="M2 7l10 7 10-7"/>
              </svg>
            </span>
            <input
              class="form-field__input"
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              placeholder="example@dome.tu.ac.th"
              required
              aria-required="true"
            />
          </div>
        </div>

        <!-- Password -->
        <div class="form-field">
          <label class="form-field__label" for="password">รหัสผ่าน</label>
          <div class="form-field__input-wrap">
            <span class="form-field__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              class="form-field__input"
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
              aria-required="true"
            />
            <button
              class="form-field__toggle-pw"
              type="button"
              id="togglePwBtn"
              aria-label="แสดงรหัสผ่าน"
              aria-pressed="false"
            >
              <!-- Eye-off (default: password hidden) -->
              <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round"
                   aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
              <!-- Eye (password visible) -->
              <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round"
                   aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Options row -->
        <div class="login-form__options">
          <label class="login-form__remember" for="remember">
            <input type="checkbox" id="remember" name="remember" />
            จดจำฉัน
          </label>
          <a class="login-form__forgot" href="#">ลืมรหัสผ่าน?</a>
        </div>

        <!-- Inline error message slot (populated by login.js) -->
        <p class="login-form__error" id="loginError" role="alert" hidden></p>

        <!-- Submit -->
        <button class="btn-login" id="loginBtn" type="submit">
          เข้าสู่ระบบ
        </button>

      </form>
    </div>
  </main>

  <!-- ════════════════════════════════════════
       Right panel – background + branding
  ════════════════════════════════════════ -->
  <aside class="hero-panel" aria-label="JANGRUEANG TU branding">
    <img
      class="hero-panel__bg"
      src="../image/library.png"
      alt="ห้องสมุดมหาวิทยาลัยธรรมศาสตร์"
      loading="lazy"
    />
  </aside>

  <!-- AWS Cognito Identity SDK – exposes window.AmazonCognitoIdentity -->
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
  <!-- App login logic -->
  <script src="../js/login.js"></script>
</body>
</html>
