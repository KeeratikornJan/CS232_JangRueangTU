<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แจ้งเหตุ - Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
  <link rel="icon" type="image/x-icon" href="../image/JangRueang.png"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="../css/layout-headerAdmin.css" />
  <link rel="stylesheet" href="../css/incidentAdmin.css" />
</head>
<body>
  <header class="topbar">
    <a href="LoginPage.html" class="topbar-left" style="text-decoration: none; color: white;" >
      <img
        class="admin-avatar"
        src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=200&auto=format&fit=crop"
        alt="admin avatar"
        style="width: 35px; height: 35px;"
      />
      <span class="admin-name">พี่แอดมิน ใจดี</span>
    </a>

    <div class="topbar-center">
      <div class="topbar-title">แจ้งเหตุ</div>
    </div>

    <div class="topbar-brand">
      <a href="http://cs232-jangrueangtu-user.s3-website-us-east-1.amazonaws.com/index.html">
          <img class="Logo"
          src="../image/LOGO.png" 
          alt="JangruengBlueLogo">
      </a>
    </div>
  </header>

  <div class="page-layout">
    <aside class="sidebar">
      <div class="sidebar-group">
        <div class="sidebar-heading">ภาพรวม</div>
        <a class="sidebar-link" href="../dashboardAdmin.html">
          <span>Dashboard</span>
        </a>
      </div>

      <div class="sidebar-group">
        <div class="sidebar-heading">รับเรื่อง</div>

        <a class="sidebar-link" href="complaintsAdmin.html">
          <span>ร้องเรียน</span>
          <span class="count-badge">14</span>
        </a>

        <div class="sidebar-incident-wrap">
          <a class="sidebar-link active" href="#">
            <span>แจ้งเหตุ</span>
            <span class="sidebar-link-right">
              <span class="count-badge" id="sidebarIncidentCount">16</span>
              <span class="material-symbols-outlined">keyboard_arrow_down</span>
            </span>
          </a>

          <a class="sidebar-submenu active-submenu" href="incident-historyAdmin.html">
            ประวัติการแจ้งเหตุ
          </a>
        </div>
      </div>

      <div class="sidebar-group">
        <div class="sidebar-heading">จัดการ</div>
        <a class="sidebar-link" href="forwardAdmin.html">
          <span>ส่งต่อหน่วยงาน</span>
        </a>
      </div>
    </aside>

    <main class="content incident-content">
      <div class="incident-toolbar">
        <button class="sos-btn" type="button">SOS</button>

        <select class="sort-select" id="sortSelect">
          <option value="latest">ล่าสุด  ⇅</option>
          <option value="oldest">เก่าสุด  ⇅</option>
        </select>
      </div>

      <section class="incident-grid" id="incidentGrid"></section>
    </main>
  </div>
  <script src="../js/mockData.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/incidentAdmin.js"></script>
</body>
</html>
