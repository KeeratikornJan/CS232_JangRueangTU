<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ระบบร้องเรียน แจ้งเหตุ ในมหาวิทยาลัยธรรมศาสตร์" />
  <title>JANGRUEANG TU – เข้าสู่ระบบ</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="LoginPage.css" />
</head>
<body>

  <!-- ════════════════════════════════════════
       Left panel – login form
  ════════════════════════════════════════ -->
  <main class="login-panel" role="main">
    <div class="login-panel__form-wrap">

      <h1 class="login-panel__heading">ยินดีต้อนรับ</h1>

      <form class="login-form" id="loginForm" novalidate>

        <!-- Username -->
        <div class="form-field">
          <label class="form-field__label" for="username">ชื่อผู้ใช้</label>
          <div class="form-field__input-wrap">
            <span class="form-field__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
              </svg>
            </span>
            <input
              class="form-field__input"
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              required
              aria-required="true"
            />
          </div>
        </div>

        <!-- Password -->
        <div class="form-field">
          <label class="form-field__label" for="password">รหัสผ่าน</label>
          <div class="form-field__input-wrap">
            <span class="form-field__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              class="form-field__input"
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
              aria-required="true"
            />
            <button
              class="form-field__toggle-pw"
              type="button"
              id="togglePwBtn"
              aria-label="แสดงรหัสผ่าน"
              aria-pressed="false"
            >
              <!-- Eye-off (default: password hidden) -->
              <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round"
                   aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
              <!-- Eye (password visible) -->
              <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round"
                   aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Options row -->
        <div class="login-form__options">
          <label class="login-form__remember" for="remember">
            <input type="checkbox" id="remember" name="remember" />
            จดจำฉัน
          </label>
          <a class="login-form__forgot" href="#">ลืมรหัสผ่าน?</a>
        </div>

        <!-- Submit -->
        <button class="btn-login" type="submit">เข้าสู่ระบบ</button>

      </form>
    </div>
  </main>

  <!-- ════════════════════════════════════════
       Right panel – background + branding
  ════════════════════════════════════════ -->
  <aside class="hero-panel" aria-label="JANGRUEANG TU branding">
    <img
      class="hero-panel__bg"
      src="https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=1400&q=80"
      alt="ห้องสมุดมหาวิทยาลัยธรรมศาสตร์"
      loading="lazy"
    />

    <div class="brand" role="img" aria-label="JANGRUEANG TU – ร้องเรียน แจ้งเหตุ ในมหาวิทยาลัยธรรมศาสตร์">
      <div class="brand__inner">
        <div class="brand__icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
               stroke="white" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>
        <div class="brand__text">
          <p class="brand__name">JANGRUEANG <span class="brand__name--accent">TU</span></p>
          <p class="brand__tagline">
            ร้องเรียน แจ้งเหตุ
            <strong class="brand__tagline--bold">ในมหาวิทยาลัยธรรมศาสตร์</strong>
          </p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Script -->
  <script src="LoginPage.js"></script>
</body>
</html>
